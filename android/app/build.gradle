plugins { id 'com.android.application' }

dependencies { testImplementation 'junit:junit:4.13.2' }

android {
    namespace 'org.re2ds.thor'
    compileSdk 35
    ndkVersion '27.0.12077973'
    sourceSets.main.assets.srcDirs = ['../../build/android-assets']
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    defaultConfig {
        applicationId 'org.re2ds.thor'
        minSdk 26
        targetSdk 33
        versionCode 9
        versionName '0.9-world-foundation'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { disable 'ExpiredTargetSdkVersion' }
}
